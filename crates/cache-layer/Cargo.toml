[package]
name = "coderabbit-cache-layer"
version = "0.1.0"
edition = "2021"
authors = ["CodeRabbit Team"]
license = "MIT"
description = "Multi-tier cache layer for CodeRabbit AI PR Reviewer"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Database and caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
sled = "0.34"

# System dependencies
chrono = { version = "0.4", features = ["serde"] }

# Compression
flate2 = "1.0"
bincode = "1.3"
lz4_flex = "0.11"

# Async traits
async-trait = "0.1"

[dependencies.coderabbit-shared]
path = "../shared"

[dev-dependencies]
tempfile = "3.0"
