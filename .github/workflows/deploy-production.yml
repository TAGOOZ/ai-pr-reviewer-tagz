name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Validate production config
      run: |
        echo "Validating config/production.toml..."
        cargo run --bin validate-config -- --env production || echo "Validator not available"
    
    - name: Check required secrets
      run: |
        echo "Checking required secrets are set..."
        required_secrets=("DATABASE_URL" "JWT_SECRET" "OPENAI_API_KEY")
        for secret in "${required_secrets[@]}"; do
          if [ -z "${!secret}" ]; then
            echo "Warning: $secret not set in this check"
          fi
        done

  build:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: api-gateway
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push AI Pipeline
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: ai-pipeline
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ai-pipeline:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
    
    - name: Update ConfigMap
      run: |
        kubectl create configmap coderabbit-config \
          --from-file=production.toml=config/production.toml \
          --namespace coderabbit \
          --dry-run=client -o yaml | kubectl apply -f -
    
    - name: Deploy to Kubernetes
      run: |
        # Update image tag
        kubectl set image deployment/api-gateway \
          api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ github.ref_name }} \
          --namespace coderabbit
        
        kubectl set image deployment/ai-pipeline \
          ai-pipeline=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ai-pipeline:${{ github.ref_name }} \
          --namespace coderabbit
        
        # Wait for rollout
        kubectl rollout status deployment/api-gateway --namespace coderabbit --timeout=300s
        kubectl rollout status deployment/ai-pipeline --namespace coderabbit --timeout=300s
    
    - name: Verify deployment
      run: |
        kubectl get pods -n coderabbit
        kubectl get services -n coderabbit
    
    - name: Health check
      run: |
        API_URL=$(kubectl get service api-gateway -n coderabbit -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        curl -f "http://${API_URL}/health" || echo "Health check pending..."

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.deploy.result == 'success'
      run: |
        echo "Production deployment successful!"
        echo "Version: ${{ github.ref_name }}"
    
    - name: Notify on failure
      if: needs.deploy.result == 'failure'
      run: |
        echo "Production deployment failed!"
        exit 1
