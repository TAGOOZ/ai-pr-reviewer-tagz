[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "coderabbit-ai-pipeline"
version = "0.1.0"
description = "DSPy-powered AI pipeline for CodeRabbit code review system"
authors = ["CodeRabbit Team <team@coderabbit.ai>"]
readme = "README.md"
packages = [{include = "coderabbit_ai", from = "python"}]

[tool.poetry.dependencies]
python = "^3.11"
dspy-ai = "^2.4.0"
openai = "^1.12.0"
anthropic = "^0.18.0"
pydantic = "^2.6.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
protobuf = "^4.25.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
asyncio = "^3.4.3"
aiohttp = "^3.9.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"
tenacity = "^8.2.0"
msgpack = "^1.0.8"
sentence-transformers = "^2.5.0"
torch = "^2.2.0"
psutil = "^5.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["coderabbit_ai"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]