version: '3.8'

services:
  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coderabbit_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d coderabbit_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - test-postgres-data:/var/lib/postgresql/data

volumes:
  test-postgres-data:
