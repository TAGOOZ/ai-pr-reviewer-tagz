# CodeRabbit Production Configuration
# 
# This configuration is optimized for production deployments.
# All sensitive values should be loaded from environment variables.
#
# Usage:
#   cargo run --config config/production.toml
#
# Environment variables (highest priority):
#   - Secrets: OPENAI_API_KEY, JWT_SECRET, GITHUB_TOKEN
#   - Overrides: Any environment variable will override these defaults

[server]
host = "0.0.0.0"
port = 8080
workers = 8

[database]
# Use PostgreSQL in production (not SQLite)
url = "${DATABASE_URL:postgresql://coderabbit:${DB_PASSWORD}@db:5432/coderabbit}"
max_connections = 50
min_connections = 10
connection_timeout = 30

[redis]
# Use production Redis with authentication
url = "${REDIS_URL:redis://:${REDIS_PASSWORD}@redis:6379/0}"
pool_size = 20
connection_timeout = 5

[ai]
# OpenAI configuration
openai_api_key = "${OPENAI_API_KEY}"
anthropic_api_key = "${ANTHROPIC_API_KEY:}"
cohere_api_key = "${COHERE_API_KEY:}"

# Model settings (optimized for production)
default_model = "gpt-4"
max_tokens = 8192
temperature = 0.3

[auth]
# JWT security settings
jwt_secret = "${JWT_SECRET}"  # MUST be at least 32 characters
token_expiration_hours = 24
refresh_token_expiration_days = 30
skip_auth = false  # NEVER enable in production

[python_service]
host = "localhost"
port = 8000
workers = 4

[vector_db]
# Production vector database settings
lancedb_path = "/var/lib/coderabbit/lancedb"
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_dimension = 384

[security]
# CORS configuration (production)
enable_cors = true
# Replace with actual production domains
allowed_origins = "${ALLOWED_ORIGINS:https://coderabbit.ai,https://app.coderabbit.ai}"
rate_limit_requests_per_minute = 100
enable_secret_scanning = true

[sandbox]
# Production sandbox limits
execution_timeout = 30
max_memory_mb = 1024
max_cpus = 2.0
max_processes = 100
docker_image = "coderabbit-sandbox:latest"
max_output_size_bytes = 5242880  # 5MB

[feature_flags]
# Feature flags for production
enable_security_scanning = true
enable_ai_review = true
enable_vector_search = true
enable_metrics = true
enable_pr_test_runner = false  # Disabled by default in production
enable_deepwiki_integration = true
enable_devin_integration = false

[general]
environment = "production"
log_level = "info"
