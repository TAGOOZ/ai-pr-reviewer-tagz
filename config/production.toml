[server]
host = "0.0.0.0"
port = 8080
workers = 8

[database]
url = "${DATABASE_URL}"
max_connections = 20
min_connections = 5
connection_timeout = 30

[redis]
url = "${REDIS_URL}"
pool_size = 20
connection_timeout = 5

[ai]
openai_api_key = "${OPENAI_API_KEY}"
anthropic_api_key = "${ANTHROPIC_API_KEY}"
default_model = "gpt-4"
max_tokens = 4096
temperature = 0.3

environment = "production"
log_level = "info"