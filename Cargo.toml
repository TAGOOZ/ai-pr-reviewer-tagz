[workspace]
members = [
    "crates/api-gateway",
    "crates/code-analyzer",
    "crates/vector-engine",
    "crates/cache-layer",
    "crates/shared",
    "crates/orchestrator",
    "crates/python-bridge",
    "crates/security",
    "tests"
]
resolver = "2"

[workspace.dependencies]
# Async runtime and web framework
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Database and caching
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
sled = "0.34"

# Embedding model operations (using sentence-transformers compatible format)
ndarray = "0.15"

# File system utilities
walkdir = "2.5"

# Code analysis
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-java = "0.20"
tree-sitter-go = "0.20"

# Parallel processing
rayon = "1.8"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# UUID and time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"

# Testing
proptest = "1.4"
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.12"
tempfile = "3.8"
assert_matches = "1.5"

# Async traits
async-trait = "0.1"

# Python bridge
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-macros = "0.20"
numpy = { version = "0.23", features = [] }

# Compression
flate2 = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

[patch.crates-io]
# Pin chrono via git to avoid ambiguous Datelike::quarter vs ChronoDateExt::quarter in arrow-arith
chrono = { git = "https://github.com/chronotope/chrono", tag = "v0.4.31" }
